name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      - name: Install
        run: npm ci

      # 17-04: same policy as ago-console's and ago-widget's own CI - Critical/High fails the build,
      # Moderate/Low is reported but does not (docs/runbooks/vulnerability-response.md, ago-root).
      - name: Vulnerability check (npm audit)
        run: npm audit --audit-level=high

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      # The build needs the three VITE_* values `src/config.ts` requires, and this repository has no
      # committed `.env.production` yet because AGO Calendar has no deployment - see the Dockerfile
      # for why inventing one would be worse than not having one. These placeholders exist to prove
      # the bundle *compiles*, and they are `.invalid` on purpose so that nothing can mistake a CI
      # artifact for something deployable.
      #
      # **When a real deployment exists, delete these and commit `.env.production` instead.**
      # `adr/0051` is explicit that a frontend image must take no environment input from its build
      # command: leaving these here once the file exists would let CI build a bundle pointed
      # somewhere other than the commit says.
      - name: Build
        env:
          VITE_API_BASE_URL: https://calendar.invalid
          VITE_KEYCLOAK_AUTHORITY: https://auth.invalid/realms/ago-chat
          VITE_KEYCLOAK_CLIENT_ID: ago-calendar-console
        run: npm run build

      - name: Install the UX gate's browser
        run: npx playwright install --with-deps chromium

      - name: Rendered UX gate
        # `15-11` made this step non-blocking on purpose, as a dated compromise rather than a setting:
        # its first run found two real, pre-existing defects - every screen overflowing at 375px
        # (#22) and a handful of controls under WCAG's 24px minimum (#23) - and making the gate
        # blocking with those open would have reddened every pull request for a defect it did not
        # introduce. `15-12` fixed both (six `<NavLink>`s that did not wrap, a table wider than its
        # panel, and two checkbox `<label>`s sized to their own unstyled content) and removed the
        # `continue-on-error: true` that stood here - this step now fails the build like any other.
        run: npm run ux-gate

      - name: Upload UX gate screenshots
        # Uploaded on failure too - a screenshot of the screen a failing assertion describes is the
        # more useful artifact exactly when the gate is red. These are also, today, the only way to
        # look at the workers, slots and re-cut screens at all: AGO Calendar is not deployed
        # (`ago-root` `20-20`), and this gate renders them from source.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ux-gate-screenshots
          path: ux-gate/screenshots/
          retention-days: 30
          if-no-files-found: warn

  # `20-20`: this job did not exist until 2026-09-02, and the comment that stood here said why - "a
  # job that pushed an image nobody pulls would be ceremony that looks like infrastructure. It
  # arrives with the deployment." The deployment is now arriving, so it has arrived. Modelled on
  # `ago-console`'s own job, itself modelled on `ago-chat`'s (`adr/0047`/`adr/0051`).
  publish-images:
    needs: build-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # A repository's own GITHUB_TOKEN can write to that repository's own package feed, so this
      # needs no new secret. Only *reading* a private package would, which is why `adr/0047` wants
      # these public.
      packages: write
    steps:
      - uses: actions/checkout@v7

      # No docker/login-action: `docker login` with the workflow token does the same thing with one
      # fewer third-party action in the supply chain.
      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      # Note what is NOT passed: no VITE_* build arg of any kind. The bundle's configuration comes
      # from the committed `.env.production`, so this image is a function of the commit alone - which
      # is the only thing that lets ${{ github.sha }} be a truthful name for it (`adr/0051`).
      # `main` moves and exists only for convenience; there is deliberately no `latest`.
      - name: Build the console image
        env:
          DOCKER_BUILDKIT: "1"
        run: |
          set -euo pipefail
          repo="ghcr.io/${{ github.repository_owner }}/ago-calendar-console"
          docker build \
            --build-arg "GIT_COMMIT=${{ github.sha }}" \
            -t "${repo}:${{ github.sha }}" \
            -t "${repo}:main" \
            .

      # Proves the commit reached the served files, not merely the tag. The Dockerfile already writes
      # version.json; this reads it back out of the built image. A published image that cannot name
      # its own commit is the 2026-08-25 failure with extra steps.
      - name: Check the image can name its own commit
        run: |
          set -euo pipefail
          repo="ghcr.io/${{ github.repository_owner }}/ago-calendar-console"
          served=$(docker run --rm --entrypoint cat "${repo}:${{ github.sha }}" /usr/share/nginx/html/version.json)
          echo "$served"
          echo "$served" | grep -q '"commit":"${{ github.sha }}"'

      # Before push, not after: it only ever needed the local image (`17-04`). Trivy is pinned by
      # digest rather than trusted at a floating tag - both its tags and its Docker Hub image were
      # compromised in March 2026.
      - name: Scan image for known vulnerabilities (Trivy)
        run: |
          set -euo pipefail
          repo="ghcr.io/${{ github.repository_owner }}/ago-calendar-console"
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969 \
            image --scanners vuln --severity CRITICAL,HIGH --exit-code 1 --format table \
            "${repo}:${{ github.sha }}"

      - name: Push
        run: |
          set -euo pipefail
          repo="ghcr.io/${{ github.repository_owner }}/ago-calendar-console"
          docker push "${repo}:${{ github.sha }}"
          docker push "${repo}:main"

      - name: Summarise what was published
        run: |
          {
            echo "### Image published"
            echo
            echo "- \`ghcr.io/${{ github.repository_owner }}/ago-calendar-console:${{ github.sha }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
