name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      - name: Install
        run: npm ci

      # 17-04: same policy as ago-console's and ago-widget's own CI - Critical/High fails the build,
      # Moderate/Low is reported but does not (docs/runbooks/vulnerability-response.md, ago-root).
      - name: Vulnerability check (npm audit)
        run: npm audit --audit-level=high

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      # The build needs the three VITE_* values `src/config.ts` requires, and this repository has no
      # committed `.env.production` yet because AGO Calendar has no deployment - see the Dockerfile
      # for why inventing one would be worse than not having one. These placeholders exist to prove
      # the bundle *compiles*, and they are `.invalid` on purpose so that nothing can mistake a CI
      # artifact for something deployable.
      #
      # **When a real deployment exists, delete these and commit `.env.production` instead.**
      # `adr/0051` is explicit that a frontend image must take no environment input from its build
      # command: leaving these here once the file exists would let CI build a bundle pointed
      # somewhere other than the commit says.
      - name: Build
        env:
          VITE_API_BASE_URL: https://calendar.invalid
          VITE_KEYCLOAK_AUTHORITY: https://auth.invalid/realms/ago-chat
          VITE_KEYCLOAK_CLIENT_ID: ago-calendar-console
        run: npm run build

      - name: Install the UX gate's browser
        run: npx playwright install --with-deps chromium

      - name: Rendered UX gate
        # `15-11`. **Non-blocking on purpose, and this is a dated compromise rather than a setting.**
        # The gate's first run against this repository found two real things: every one of the eight
        # screens overflows the viewport at 375px (issue #22) and a handful of controls sit two to
        # four pixels under WCAG's 24px minimum (issue #23). Neither is caused by this change; both
        # were simply never measured before. Making the gate blocking today would make every pull
        # request in this repository red for a defect it did not introduce, which trains people to
        # ignore a red build - the opposite of what a gate is for.
        #
        # A step that always warns is its own hazard, so this is not a steady state: **when #22 and
        # #23 close, delete this line.** Until then the failures are visible on every run rather than
        # hidden behind an exemption list, and the screenshots below are produced either way.
        continue-on-error: true
        run: npm run ux-gate

      - name: Upload UX gate screenshots
        # Uploaded on failure too - a screenshot of the screen a failing assertion describes is the
        # more useful artifact exactly when the gate is red. These are also, today, the only way to
        # look at the workers, slots and re-cut screens at all: AGO Calendar is not deployed
        # (`ago-root` `20-20`), and this gate renders them from source.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ux-gate-screenshots
          path: ux-gate/screenshots/
          retention-days: 30
          if-no-files-found: warn

  # There is deliberately no publish-images job yet. `ago-console` has one because something deploys
  # its image; nothing deploys this one, and a job that pushed an image nobody pulls would be
  # ceremony that looks like infrastructure. It arrives with the deployment, modelled on
  # `ago-console`'s (`adr/0047`/`adr/0051`).
