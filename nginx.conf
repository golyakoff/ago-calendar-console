# Serves the built SPA with a client-side-routing fallback: any path that does not match a real file
# - `/callback`, the OIDC redirect target, at minimum - falls back to index.html and lets
# react-router take over, instead of nginx returning a bare 404 for anything but the exact root.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri /index.html;
    }
}
